[project]
name = "toy-gaussian"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonargparse[signatures]>=4.51.0",
    "jupyter>=1.1.1",
    "lightning==2.6.1",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch==2.13.0",
    "torchmetrics",
    "wandb>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toy_gaussian"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[tool.uv]
package = true
